<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-lTum3vYIDmzXMDUxbDwPMPn2SkqyQoBQTnh8os7GaUM=' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#fff;--side:#e8eef2;--text:#1f2328;--muted:#6b7580;--line:#c9d1d8;--head:#f1f1f1;--gray:#808080;--accent:#7719aa;--sel:#e6e6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f23;--side:#262b31;--text:#e6e8ea;--muted:#9aa4ae;--line:#434b54;--head:#2b3036;--gray:#555b62;--accent:#c58af0;--sel:#3a4047;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1f23;--side:#262b31;--text:#e6e8ea;--muted:#9aa4ae;--line:#434b54;--head:#2b3036;--gray:#555b62;--accent:#c58af0;--sel:#3a4047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
#app{display:flex;min-height:100vh}
#secs{width:220px;background:var(--side);padding:12px 8px;flex:none}
#pgs{width:210px;border-right:1px solid var(--line);padding:12px 8px;flex:none}
main{flex:1;min-width:0;padding:20px 24px}
#nsel{width:100%;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:600}
.sec{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer}
.sec b{width:6px;height:16px;border-radius:3px;flex:none}
.sec.on{background:var(--bg);font-weight:600}
.sec span,.pg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{opacity:.5;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px}
.x:hover{opacity:1}
.pg{display:flex;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;color:var(--muted);border-radius:3px}
.pg.on{background:var(--sel);color:var(--text);font-weight:600}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}
.sm{padding:3px 8px;font-size:12px}
.link{color:var(--accent);background:none;border:0;cursor:pointer;font:inherit;padding:8px 8px}
.top{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
#page{position:relative;min-height:500px}
#title{font-size:24px;border-bottom:1px solid var(--line);padding:2px 0;outline:0;min-width:200px;width:fit-content;max-width:100%}
#sub{color:#d33;font-size:12px;margin:10px 0 14px;outline:0;min-height:16px;min-width:200px;width:fit-content}
#sub:empty:before{content:attr(data-ph);color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
table.w{min-width:900px;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;font-size:12px;outline:0;word-wrap:break-word}
th{background:var(--head);color:var(--muted);font-size:14px;text-align:center;padding:8px}
table.w td:first-child{background:var(--head);color:#2b79b8;font-weight:600;width:150px}
td.g{background:var(--gray)}
.bc table{margin:4px 0}.bc th{font-size:12px;text-align:left;padding:4px 6px}
.box{position:absolute;z-index:5;min-width:80px;border:1px solid transparent;border-radius:4px}
.box:hover,.box:focus-within{border-color:var(--line);background:var(--bg)}
.bh{height:18px;display:flex;justify-content:space-between;align-items:center;cursor:move;opacity:0;touch-action:none;background:var(--head);padding:0 4px;color:var(--muted)}
.box:hover .bh,.box:focus-within .bh{opacity:1}
@media(hover:none){.bh{opacity:.7}}
.bx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.bc{min-height:26px;padding:4px 6px;outline:0;overflow-x:auto}
.bc:empty:before{content:attr(data-ph);color:var(--muted)}
.box img{display:block;width:100%;height:auto;border-radius:3px}
.br{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:ew-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%);opacity:0}
.box:hover .br,.box:focus-within .br{opacity:.8}
#fb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#fb select{padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;max-width:120px}
#fb label{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
#fb input[type=color]{width:24px;height:20px;border:0;padding:0;background:none}
.ms{outline:2px solid var(--accent);outline-offset:-2px}
table.xl{table-layout:fixed;border-collapse:collapse}
table.xl td{border:0;padding:2px 4px;background:#fff;color:#000;font-size:14px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:18px;max-width:92vw;min-width:280px}
#sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px}
#q{width:100%;max-width:520px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#res{position:absolute;left:10px;top:100%;width:min(560px,calc(100vw - 20px));max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.rs{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}.rs:hover{background:var(--sel)}.rs span{color:var(--muted);font-size:12px;margin-left:6px}.rs div{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lk{width:100%;max-width:360px}.lk h2{margin:0 0 4px}.lk label{display:block;margin:10px 0 2px;color:var(--muted)}
.lk input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
#lkErr{color:#d33;margin-top:10px;min-height:18px}
#stt{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--muted)}
dialog textarea{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:12px monospace}
dialog select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.bc table.t1{border-collapse:collapse}.bc table.t1 td,.bc table.t1 th{border:1px solid var(--line);padding:4px 6px;height:28px;min-width:60px}
dialog label{display:block;margin:8px 0 2px;color:var(--muted)}
dialog input{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>div{flex:1;min-width:90px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:50}
@media(max-width:760px){#app{flex-direction:column}#secs,#pgs{width:100%;border:0}main{padding:14px}}
</style>
</head>
<body>
<div id="sbar"><input id="q" type="search" placeholder="🔍 Rechercher dans tous les carnets (Ctrl+K)" autocomplete="off"><div id="res"></div></div>
<div id="app"><nav id="secs"></nav><nav id="pgs"></nav><main id="main"></main></div>
<input type="file" id="fImg" accept="image/*" multiple hidden><input type="file" id="fXls" accept=".xlsx,.xls,.csv" hidden>
<div id="lock"><div class="lk"><h2>📓 Mon carnet</h2><p id="lkMsg" style="margin:0;color:var(--muted)"></p>
<label>E-mail</label><input id="lkE" type="email" autocomplete="username">
<label>Mot de passe</label><input id="lkP" type="password" autocomplete="current-password">
<div id="lkSet" style="display:none"><label>Dépôt privé de données (pseudo/nom)</label><input id="lkR" autocomplete="off">
<label>Jeton GitHub (accès à ce dépôt uniquement)</label><input id="lkT" type="password" autocomplete="off"></div>
<button class="btn" id="lkGo" style="margin-top:14px;border-color:var(--accent)">Se connecter</button><div><button class="link" id="lkCh" style="display:none">🔑 Changer le jeton / le dépôt</button></div><div id="lkErr"></div></div></div>
<div id="toast"></div>
<div id="stt"><span id="sts"></span><button class="btn sm" id="bX">💾 Exporter</button><button class="btn sm" id="bI">📥 Importer</button><button class="btn sm" id="bL" style="display:none">🔒 Verrouiller</button><button class="btn sm" id="bK" style="display:none" title="Changer le jeton GitHub">🔑 Jeton</button></div>
<dialog id="dx"><h3 id="dxT" style="margin:0 0 6px"></h3><p id="dxP" style="margin:0 0 6px;color:var(--muted)"></p><textarea id="dxA" rows="8"></textarea><input type="file" id="dxF" accept=".json,.txt" style="margin-top:6px"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="dxC">Copier</button><button class="btn" id="dxD">Télécharger</button><button class="btn" id="dxOk" style="border-color:var(--accent)">Importer</button><button class="btn" id="dxNo">Fermer</button></div></dialog>
<dialog id="dq"><p id="ql" style="margin:0 0 8px"></p><input id="qi"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="qno">Annuler</button><button class="btn" id="qok" style="border-color:var(--accent)">OK</button></div></dialog>
<dialog id="dlg">
 <h3 style="margin:0 0 6px">Pré-créer des pages hebdomadaires</h3>
 <p style="margin:0;color:var(--muted)">Les matières sont copiées depuis la page ouverte (ou le modèle par défaut).</p>
 <label>Nom après le numéro</label><input id="dPre" value="Rapport BTS">
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dDt" checked style="width:auto"> Afficher les dates (colonnes et sous-titre)</label>
 <div class="row"><div><label>Début : année</label><input id="dY" type="number" value="2026"></div>
 <div><label>Semaine début</label><input id="dA" type="number" value="37"></div>
 <div><label>Fin : année</label><input id="dY2" type="number" value="2027"></div>
 <div><label>Semaine fin</label><input id="dB" type="number" value="25"></div>
 <div><label>Pas</label><input id="dS" type="number" value="2" min="1"></div></div>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="dNo">Annuler</button><button class="btn" id="dOk" style="border-color:var(--accent)">Créer les pages</button></div>
</dialog>
<dialog id="dn"><h3 id="dnT" style="margin:0 0 6px">Nouveau tableau</h3>
 <div class="row nf"><div><label>Lignes</label><input id="nR" type="number" value="5" min="1" max="100"></div><div><label>Colonnes</label><input id="nC" type="number" value="5" min="1" max="30"></div></div>
 <label class="nf">Dates automatiques</label><select id="nM" class="nf"><option value="">Sans dates (tableau vide)</option><option value="c">Dates dans l’en-tête (colonnes)</option><option value="r">Dates dans la 1re colonne (lignes)</option></select>
 <div id="nDt"><div class="row"><div><label>Date de début</label><input id="nD" type="date"></div><div><label>Pas (jours)</label><input id="nP" type="number" value="1" min="1"></div></div>
 <label>Format</label><select id="nF"><option value="c">Lun 07 Sept</option><option value="l">Lundi 07 Septembre</option><option value="n">07/09/2026</option><option value="d">07 Septembre 2026</option><option value="j">Lundi (jour seul, sans date)</option></select>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nW" checked style="width:auto"> Sans week-end</label></div>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="nNo">Annuler</button><button class="btn" id="nOk" style="border-color:var(--accent)">Créer le tableau</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var KEY='carnet-bts-v2',OLD='carnet-bts-v1';
var DAYS=['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI'];
var MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var COLORS=['#1b4f8a','#2aa5d8','#2ba84a','#e8622a','#a23bb5','#d4a017'];
var SUBJ=['MATHEMATIQUES<br>Me. DUQUESNE H.','CULTURE GENERALE ET EXPRESSION<br>M. SAUTIERE Y.','ANGLAIS<br>ME. LOYEZ V.','PHYSIQUE-CHIMIE<br>M. CLERY P.','PHYSIQUE-CHIMIE<br>M. MAILLARD P','Electrotechnique<br>INTEGRATION D’UN BIEN<br>M. BERLANCOURT F.','Automatismes<br>AP ET GESTION DE PROJETS<br>M. MIETTE S.','Analyse fonctionnelle et structurelle<br>M. FONTAINE B.','ORGANISATION DE LA MAINTENANCE<br>M. WEMAERE P.','TECHNIQUES DE MAINTENANCE<br>M. LELOUTRE L.','TECHNIQUES DE MAINTENANCE<br>M. WEMAERE P.','AP & Dossier de 1ere année<br>M. MAILLARD P.'];
var D,lastTd=null,tm=null,qcb=null;
function $(i){return document.getElementById(i)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},4000)}
function isoW(d){d=new Date(d);d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));return Math.ceil(((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5+1)/7)}
function wiy(y){return isoW(Date.UTC(y,11,28))}
function monday(y,w){var j4=new Date(Date.UTC(y,0,4)),d=j4.getUTCDay()||7,m=new Date(j4);m.setUTCDate(j4.getUTCDate()-d+1+(w-1)*7);return m}
function add(d,n){var x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x}
function fmt(d){return String(d.getUTCDate()).padStart(2,'0')+' '+MOIS[d.getUTCMonth()]}
function blank(t){return {id:uid(),title:t||'Nouvelle page',sub:'',cols:null,rows:null,boxes:[]}}
function weekPage(pre,y,w,subj,nd){
 var m=monday(y,w),cols=['Matières'];
 for(var i=0;i<5;i++)cols.push(nd===false?DAYS[i]:DAYS[i]+' '+fmt(add(m,i)));
 cols.push('PROCHAINE ALTERNANCE');
 var rows=subj.map(function(s){var r=[{t:s,g:0}];for(var i=0;i<6;i++)r.push({t:'',g:0});return r});
 return {id:uid(),y:y,title:'S'+w+' '+pre,sub:nd===false?'Semaine '+w:'Semaine '+w+' : du '+fmt(m)+' au '+fmt(add(m,4))+' '+add(m,4).getUTCFullYear(),cols:cols,rows:rows,boxes:[]}
}
function newNb(n){return {id:uid(),name:n,sections:[{id:uid(),name:'Section 1',color:COLORS[0],pages:[blank('Page 1')]}]}}
function seed(){
 var pages=[blank('Emploi du temps')];
 for(var w=37;w<=51;w+=2)pages.push(weekPage('Rapport BTS',2026,w,SUBJ));
 var s=pages[1];s.rows[0][4].t='EQUATIONS/INEQUATIONS';s.rows[5][1].t='<b>Test de rentrée (non noté)</b>';s.rows[11][1].t='<b>Accueil rentrée</b><br>- Emploi du temps';
 [[0,1],[0,2],[0,3],[1,1],[1,2],[1,3],[1,5]].forEach(function(p){s.rows[p[0]][p[1]].g=1});
 return fix({cur:{n:0,s:1,p:1},nbs:[{id:uid(),name:'Rapport de stage',sections:[{id:uid(),name:'Rapport ENTREPRISE',color:COLORS[0],pages:[]},{id:uid(),name:'Rapport BTS',color:COLORS[1],pages:pages},{id:uid(),name:'Idée',color:COLORS[2],pages:[]}]}]})
}
function fix(d){d.nbs.forEach(function(n){n.sections.forEach(function(s){s.pages.forEach(function(p){if(!p.boxes){p.boxes=[];if(p.notes&&p.notes.replace(/<[^>]*>/g,'').trim()||/<img|<table/.test(p.notes||''))p.boxes.push({id:uid(),k:'t',x:20,y:p.cols?170+p.rows.length*70:110,w:520,c:p.notes});delete p.notes}tabify(p)})})});return d}
function load(){
 try{var v=localStorage.getItem(KEY);if(v)return fix(JSON.parse(v));
  var o=localStorage.getItem(OLD);if(o){var q=JSON.parse(o);return fix({cur:{n:0,s:q.cur.s,p:q.cur.p},nbs:[{id:uid(),name:'Rapport de stage',sections:q.sections}]})}}catch(e){}
 return seed()
}
function save(){if(H(JSON.stringify(D.nbs))!==LH)dirty=true;clearTimeout(pt2);pt2=setTimeout(persist,600)}
function nb(){return D.nbs[D.cur.n]}
function sec(){return nb().sections[D.cur.s]}
function pg(){var s=sec();return s&&s.pages[D.cur.p]}
function clamp(){var c=D.cur;c.n=Math.min(c.n,D.nbs.length-1);var n=nb();c.s=Math.max(0,Math.min(c.s,n.sections.length-1));var s=n.sections[c.s];c.p=s?Math.max(0,Math.min(c.p,s.pages.length-1)):0}
function ask(label,val,cb,only){$('ql').textContent=label;var i=$('qi');i.style.display=only?'none':'block';i.value=val||'';qcb=cb;$('dq').showModal();if(!only){i.focus();i.select()}}
function conf(l,cb){ask(l,'',cb,true)}
$('qok').onclick=function(){var v=$('qi').value,f=qcb;qcb=null;$('dq').close();if(f)f(v)};
$('qno').onclick=function(){qcb=null;$('dq').close()};
$('qi').onkeydown=function(e){if(e.key=='Enter')$('qok').click()};
function render(){
 clamp();var n=nb();if(bulk&&bulk.sig!=D.cur.n+','+(bulk.k=='p'?D.cur.s:''))bulk=null;
 var h='<select id="nsel">'+D.nbs.map(function(x,i){return '<option value="'+i+'"'+(i==D.cur.n?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select><div class="top"><button class="btn sm" data-a="nnew">＋ Carnet</button><button class="btn sm" data-a="nren">✎ Renommer</button><button class="btn sm" data-a="ndel">🗑</button></div>';
 n.sections.forEach(function(s,i){h+='<div class="sec'+(i==D.cur.s?' on':'')+'" data-s="'+i+'">'+ck('s',i)+'<b style="background:'+s.color+'"></b><span>'+esc(s.name)+'</span><button class="x" data-rs="'+i+'" title="Renommer">✎</button><button class="x" data-ds="'+i+'" title="Supprimer">🗑</button></div>'});
 h+='<button class="link" data-a="snew">+ Nouvelle section</button>'+(bulk&&bulk.k=='s'?bbar():'<button class="link" data-a="bulks">☑ Sélectionner des sections</button>');
 $('secs').innerHTML=h;
 var s=sec(),g='<div class="top"><button class="btn" data-a="pnew">＋ Ajouter une page</button><button class="btn" data-a="gen">Pré-créer des semaines</button></div>'+(bulk&&bulk.k=='p'?bbar():'<div class="top"><button class="btn sm" data-a="bulkp">☑ Sélectionner des pages</button></div>');
 if(s)s.pages.forEach(function(p,i){g+='<div class="pg'+(i==D.cur.p?' on':'')+'" data-p="'+i+'">'+ck('p',i)+'<span>'+esc(p.title)+'</span><button class="x" data-rp="'+i+'" title="Renommer">✎</button><button class="x" data-dp="'+i+'" title="Supprimer">🗑</button></div>'});
 $('pgs').innerHTML=g;if(bulk)bsync();
 var p=pg(),m=$('main');
 if(!p){m.innerHTML='<p style="color:var(--muted)">Aucune page ici. Utilise « Ajouter une page ».</p>';return}
 var tl='<div class="tools"><button class="btn" data-a="tb">T Zone de texte</button><button class="btn" data-a="img">🖼 Image</button><button class="btn" data-a="xls">📊 Excel / CSV</button><button class="btn" data-a="ntab">▦ Tableau</button>',tb='';
 if(p.tab){tl+='<button class="btn" data-a="rmtab">Retirer le tableau</button>';tb='<div class="wrap">'+p.tab+'</div>'}
 else tl+='<button class="btn" data-a="mk">Ajouter un tableau semaine</button>';
 tl+='</div>';
 m.innerHTML=FB+'<div id="page"><div id="title" contenteditable>'+esc(p.title)+'</div><div id="sub" contenteditable data-ph="Sous-titre">'+esc(p.sub)+'</div>'+tl+'</div>';
 var pe=$('page');pe.insertAdjacentHTML('beforeend',tb);
 p.boxes.forEach(function(b){pe.appendChild(mkBox(b))});fit();ser(1);hydrate();

async function expData(){var c=JSON.parse(JSON.stringify(D.nbs));for(var a of c)for(var s of a.sections)for(var p of s.pages)for(var b of (p.boxes||[]))if(b.k=='i'&&/^idb:/.test(b.c)){var id=b.c.slice(4);await imgUrl(id);var sb=await imGet(id);if(sb)b.c='data:image/jpeg;base64,'+b64(await unsealB(sb))}return JSON.stringify({v:1,nbs:c})}
async function upImgs(){var ids=Object.keys(PEND);for(var i=0;i<ids.length;i++){var sb=await imGet(ids[i]);if(sb){var r=await gh('/contents/img/'+ids[i]+'.enc',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'img',content:b64(sb)})});if(r.status==401)throw new Error('Jeton refusé (401)');if(!r.ok&&r.status!=422&&r.status!=409)throw new Error('GitHub '+r.status)}delete PEND[ids[i]]}await kvSet('pend',Object.keys(PEND))}
/* ---- GitHub ---- */
async function pull(){
 var h={};if(ETAG)h['If-None-Match']=ETAG;
 var r=await gh('/contents/'+CFG.p,{headers:h});
 if(r.status==304)return 'same';
 if(r.status==404){SHA=null;return 'none'}
 if(r.status==401)throw new Error('Jeton refusé (401)');
 if(!r.ok)throw new Error('GitHub '+r.status);
 ETAG=r.headers.get('ETag');var j=await r.json();SHA=j.sha;var c=j.content;
 if(!c){var b=await gh('/git/blobs/'+j.sha);c=(await b.json()).content}
 try{return await unseal(TD.decode(ub(c)))}catch(e){throw new Error('Données illisibles : e-mail ou mot de passe différents de ceux utilisés à la création.')}
}
async function push(doc){
 var body={message:'sync',content:b64(TE.encode(await seal(doc)))};if(SHA)body.sha=SHA;
 var r=await gh('/contents/'+CFG.p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(r.status==409||r.status==422)return 'conflict';
 if(r.status==401)throw new Error('Jeton refusé (401)');
 if(!r.ok)throw new Error('GitHub '+r.status);
 SHA=(await r.json()).content.sha;ETAG=null;return 'ok'
}
function byId(a){var o={};(a||[]).forEach(function(x){o[x.id]=x});return o}
function mArr(B,L,R,fn){var b=byId(B),l=byId(L),r=byId(R),out=[],seen={};L.forEach(function(x){seen[x.id]=1;if(r[x.id])out.push(fn(b[x.id],x,r[x.id]));else if(!b[x.id])out.push(x)});R.forEach(function(x){if(!seen[x.id]&&!b[x.id])out.push(x)});return out}
function pick(b,l,r,k){return b&&l[k]!==b[k]?l[k]:r[k]}
function mP(b,l,r){return (l.u||0)>=(r.u||0)?l:r}
function mS(b,l,r){var o=Object.assign({},l);o.name=pick(b,l,r,'name');o.color=pick(b,l,r,'color');o.pages=mArr(b?b.pages:[],l.pages,r.pages,mP);return o}
function mN(b,l,r){var o=Object.assign({},l);o.name=pick(b,l,r,'name');o.sections=mArr(b?b.sections:[],l.sections,r.sections,mS);return o}
function cids(){var n=nb(),s=n&&n.sections[D.cur.s],p=s&&s.pages[D.cur.p];return [n&&n.id,s&&s.id,p&&p.id]}
function relocate(c){var ni=D.nbs.findIndex(function(x){return x.id==c[0]});if(ni<0)return;var n=D.nbs[ni],si=n.sections.findIndex(function(x){return x.id==c[1]});if(si<0){D.cur={n:ni,s:0,p:0};return}var pi=n.sections[si].pages.findIndex(function(x){return x.id==c[2]});D.cur={n:ni,s:si,p:Math.max(0,pi)}}
function editing(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#page'))}
async function cache(){if(!K)return;try{await kvSet('data',await seal({v:1,nbs:D.nbs,cur:D.cur,base:BASE,dirty:dirty}))}catch(e){toast('Stockage local indisponible.')}}
async function persist(){await cache();if(dirty)syncNow()}
async function syncNow(){
 if(busy||!CFG||!K)return;busy=true;setSt('⟳ Synchronisation…');
 try{
  try{ser()}catch(e){}
  await upImgs();
  var done=false;
  for(var i=0;i<3&&!done;i++){
   var rem=await pull();try{ser()}catch(e){}
   var need=dirty,c=cids();
   if(rem&&typeof rem=='object'){
    if(!dirty){D.nbs=rem.nbs;BASE=JSON.stringify(rem.nbs);LH=H(BASE);relocate(c);needR=true;done=true;break}
    D.nbs=mArr(BASE?JSON.parse(BASE):[],D.nbs,rem.nbs,mN);relocate(c);needR=true;need=true
   }else if(rem=='none')need=true;
   if(!need){done=true;break}
   var snap=JSON.stringify(D.nbs),res=await push({v:1,nbs:D.nbs});
   if(res=='ok'){BASE=snap;LH=H(snap);dirty=JSON.stringify(D.nbs)!==snap;done=true}else ETAG=null
  }
  setSt(done?'✓ Synchronisé':'⚠ Conflit, nouvel essai…');
  if(needR&&!editing()){needR=false;render()}
  await cache()
 }catch(e){setSt(navigator.onLine?'⚠ '+e.message:'⚠ Hors ligne : modifications gardées')}
 busy=false
}
async function boot(){
 var c=await kvGet('data'),legacy=false,loc=null;
 if(!c){c=localStorage.getItem('carnet-data');legacy=!!c}
 if(c){try{loc=await unseal(c)}catch(x){}}
 PEND={};((await kvGet('pend'))||[]).forEach(function(i){PEND[i]=1});
 if(loc){D={cur:loc.cur||{n:0,s:0,p:0},nbs:loc.nbs};BASE=loc.base||null;dirty=!!loc.dirty;ETAG=null}
 else{var rem=await pull();
  if(rem&&typeof rem=='object'){D={cur:{n:0,s:0,p:0},nbs:rem.nbs};BASE=JSON.stringify(rem.nbs);dirty=false}
  else{D={cur:{n:0,s:0,p:0},nbs:[newNb('Rapport de stage')]};BASE=null;dirty=true}}
 D.nbs=fix({nbs:D.nbs}).nbs;LH=BASE?H(BASE):0;
 if(await migImgs())dirty=true;
 render();await cache();if(legacy)localStorage.removeItem('carnet-data');
 $('bL').style.display='';$('bK').style.display='';bump();
 setInterval(function(){if(!document.hidden)syncNow()},10000);syncNow()
}
/* ---- écran de connexion ---- */
function lerr(m){$('lkErr').textContent=m;$('lkGo').disabled=false}
function setLk(has,c){chg=c;$('lkSet').style.display=(!has||c)?'block':'none';$('lkCh').style.display=(has&&!c)?'inline':'none';$('lkMsg').textContent=!has?'Première connexion sur cet appareil.':c?'Saisis le nouveau jeton (et le dépôt si besoin).':'Connecte-toi pour ouvrir ton carnet.';$('lkR').placeholder=c?'(vide = garder le dépôt actuel)':'monpseudo/carnet-data'}
function gate(){var has=!!localStorage.getItem('carnet-cfg'),c=false;try{c=has&&sessionStorage.getItem('carnet-chg')=='1';sessionStorage.removeItem('carnet-chg')}catch(e){}$('lock').style.display='flex';setLk(has,c)}
$('lkCh').onclick=function(){setLk(true,true)};
$('lkGo').onclick=async function(){
 var e=$('lkE').value.trim().toLowerCase(),p=$('lkP').value;if(!e||!p){lerr('Renseigne l’e-mail et le mot de passe.');return}
 $('lkGo').disabled=true;$('lkErr').textContent='Vérification…';
 try{
  K=await derive(e,p);var raw=localStorage.getItem('carnet-cfg'),fresh=false;CFG=null;
  if(raw){try{CFG=await unseal(raw)}catch(x){K=null;return lerr('E-mail ou mot de passe incorrect.')}}
  if(!raw||chg){var rp=$('lkR').value.trim()||(CFG&&CFG.r)||'',tk=$('lkT').value.trim(),pa=(CFG&&CFG.p)||'carnet.enc';
   if(!/^[\w.-]+\/[\w.-]+$/.test(rp)||!tk){K=null;CFG=null;return lerr('Renseigne le jeton'+(raw?'.':' et le dépôt (pseudo/nom).'))}
   CFG={r:rp,t:tk,p:pa};var rr=await gh('');
   if(rr.status==401){K=null;CFG=null;return lerr('Jeton refusé (401).')}
   if(!rr.ok){K=null;CFG=null;return lerr('Dépôt introuvable ou jeton sans accès ('+rr.status+').')}
   fresh=true}
  await boot();
  if(fresh)localStorage.setItem('carnet-cfg',await seal(CFG));
  $('lock').style.display='none';$('lkP').value='';$('lkT').value=''
 }catch(x){K=null;lerr('Erreur : '+x.message)}
};
['lkE','lkP','lkR','lkT'].forEach(function(i){$(i).onkeydown=function(e){if(e.key=='Enter')$('lkGo').click()}});
function bump(){clearTimeout(idle);if(K)idle=setTimeout(lockNow,15*60000)}
['click','keydown','pointerdown','touchstart'].forEach(function(ev){document.addEventListener(ev,bump,{passive:true})});
async function lockNow(){try{ser();await cache();if(dirty&&navigator.onLine)await Promise.race([syncNow(),new Promise(function(r){setTimeout(r,4000)})])}catch(e){}location.reload()}
$('bL').onclick=lockNow;
$('bK').onclick=function(){try{sessionStorage.setItem('carnet-chg','1')}catch(e){}lockNow()};
document.addEventListener('visibilitychange',function(){if(!K)return;if(document.hidden){try{ser()}catch(e){}cache()}else syncNow()});
window.addEventListener('online',function(){syncNow()});
/* ---- annuler / rétablir (15 derniers états de la page) ---- */
function undo(d){ser();var p=pg();if(!p)return;var h=HI[p.id];if(!h)return;var j=h.i+d;if(j<0||j>=h.s.length){toast(d<0?'Rien à annuler.':'Rien à rétablir.');return}h.i=j;var o=JSON.parse(h.s[j]);p.title=o[0];p.sub=o[1];p.tab=o[2];p.boxes=o[3];p.u=Date.now();save();render()}
document.addEventListener('keydown',function(e){
 if(!(e.ctrlKey||e.metaKey)||e.altKey)return;var k=e.key.toLowerCase();
 if(k=='k'){e.preventDefault();$('q').focus();$('q').select();return}
 if(k!='z'&&k!='y')return;
 if(!$('page')||(e.target.closest&&e.target.closest('input,textarea,select,dialog,#sbar')))return;
 e.preventDefault();undo(k=='z'&&!e.shiftKey?-1:1)});
/* ---- recherche globale ---- */
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function tx(h){return String(h||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ')}
function doSearch(){
 var v=$('q').value.trim(),R=$('res');if(!v||!D||!K){R.style.display='none';return}
 try{ser()}catch(e){}
 var W=nz(v).split(/\s+/),out=[];
 D.nbs.forEach(function(n,ni){n.sections.forEach(function(s,si){s.pages.forEach(function(p,pi){
  var full=[p.title,p.sub,tx(p.tab)].concat((p.boxes||[]).filter(function(b){return b.k=='t'}).map(function(b){return tx(b.c)})).join(' • '),f=nz(full);
  if(W.every(function(w){return f.indexOf(w)>=0})){var i=f.indexOf(W[0]);out.push({ni:ni,si:si,pi:pi,t:p.title,path:n.name+' › '+s.name,sn:full.slice(Math.max(0,i-30),i+80),inT:nz(p.title).indexOf(W[0])>=0?1:0})}})})});
 out.sort(function(a,b){return b.inT-a.inT});
 R.innerHTML=out.slice(0,30).map(function(x){return '<div class="rs" data-ni="'+x.ni+'" data-si="'+x.si+'" data-pi="'+x.pi+'"><b>'+esc(x.t)+'</b><span>'+esc(x.path)+'</span><div>'+esc(x.sn)+'</div></div>'}).join('')||'<div class="rs">Aucun résultat</div>';
 R.style.display='block'
}
var st3=null;
$('q').oninput=function(){clearTimeout(st3);st3=setTimeout(doSearch,200)};
$('q').onfocus=function(){if($('q').value.trim())doSearch()};
$('q').onkeydown=function(e){if(e.key=='Escape'){$('q').value='';$('res').style.display='none'}if(e.key=='Enter'){var f=document.querySelector('#res .rs[data-ni]');if(f)f.click()}};
$('res').onclick=function(e){var r=e.target.closest('.rs');if(!r||r.dataset.ni===undefined)return;ser();D.cur={n:+r.dataset.ni,s:+r.dataset.si,p:+r.dataset.pi};save();render();$('res').style.display='none'};
document.addEventListener('click',function(e){if(!e.target.closest('#sbar'))$('res').style.display='none'});
gate();

</script>
