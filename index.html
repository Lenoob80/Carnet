<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-src about:">
<style>
:root{--bg:#fff;--side:#e8eef2;--text:#1f2328;--muted:#6b7580;--line:#c9d1d8;--head:#f1f1f1;--gray:#808080;--accent:#7719aa;--sel:#e6e6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f23;--side:#262b31;--text:#e6e8ea;--muted:#9aa4ae;--line:#434b54;--head:#2b3036;--gray:#555b62;--accent:#c58af0;--sel:#3a4047;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1f23;--side:#262b31;--text:#e6e8ea;--muted:#9aa4ae;--line:#434b54;--head:#2b3036;--gray:#555b62;--accent:#c58af0;--sel:#3a4047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
#app{display:flex;min-height:100vh}
#secs{width:220px;background:var(--side);padding:12px 8px;flex:none}
#pgs{width:250px;border-right:1px solid var(--line);padding:12px 8px;flex:none}
main{flex:1;min-width:0;padding:20px 24px}
#nsel{width:100%;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:600}
.sec{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer}
.sec b{width:6px;height:16px;border-radius:3px;flex:none}
.sec.on{background:var(--bg);font-weight:600}
.sec span,.pg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{opacity:.5;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px}
.x:hover{opacity:1}
.pg{display:flex;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;color:var(--muted);border-radius:3px}
.pg.on{background:var(--sel);color:var(--text);font-weight:600}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}
.sm{padding:3px 8px;font-size:12px}
.link{color:var(--accent);background:none;border:0;cursor:pointer;font:inherit;padding:8px 8px}
.top{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
#page{position:relative;min-height:500px}
#title{font-size:24px;border-bottom:1px solid var(--line);padding:2px 0;outline:0;min-width:200px;width:fit-content;max-width:100%}
#sub{color:#d33;font-size:12px;margin:10px 0 14px;outline:0;min-height:16px;min-width:200px;width:fit-content}
#sub:empty:before{content:attr(data-ph);color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
table.w{min-width:900px;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;font-size:12px;outline:0;word-wrap:break-word}
th{background:var(--head);color:var(--muted);font-size:14px;text-align:center;padding:8px}
table.w td:first-child{background:var(--head);color:#2b79b8;font-weight:600;width:150px}
td.g{background:var(--gray)}
.bc table{margin:4px 0}.bc th{font-size:12px;text-align:left;padding:4px 6px}
.box{position:absolute;z-index:5;min-width:80px;border:1px solid transparent;border-radius:4px}
.box:hover,.box:focus-within{border-color:var(--line);background:var(--bg)}
.bh{height:18px;display:flex;justify-content:space-between;align-items:center;cursor:move;opacity:0;touch-action:none;background:var(--head);padding:0 4px;color:var(--muted)}
.box:hover .bh,.box:focus-within .bh{opacity:1}
@media(hover:none){.bh{opacity:.7}}
.bx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.bc{min-height:26px;padding:4px 6px;outline:0;overflow-x:auto}
.bc:empty:before{content:attr(data-ph);color:var(--muted)}
.box img{display:block;width:100%;height:auto;border-radius:3px}
.br{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:ew-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%);opacity:0}
.box:hover .br,.box:focus-within .br{opacity:.8}
#fb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#fb select{padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;max-width:120px}
#fb label{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
#fb input[type=color]{width:24px;height:20px;border:0;padding:0;background:none}
.ms{outline:2px solid var(--accent);outline-offset:-2px}
table.xl{table-layout:fixed;border-collapse:collapse}
table.xl td{border:0;padding:2px 4px;background:#fff;color:#000;font-size:14px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:18px;max-width:92vw;min-width:280px}
#sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px}
#q{width:100%;max-width:520px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#res{position:absolute;left:10px;top:100%;width:min(560px,calc(100vw - 20px));max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.rs{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}.rs:hover{background:var(--sel)}.rs span{color:var(--muted);font-size:12px;margin-left:6px}.rs div{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fb{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;padding:6px 0}
.fg{display:flex;flex-direction:column;gap:2px;padding-right:12px;border-right:1px solid var(--line)}
.fg:last-child{border-right:0;padding-right:0}
.fl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fr{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#fb .btn,#fb select,#fb label{height:28px;padding:0 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
#fb select{max-width:110px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.cb{cursor:pointer;user-select:none}.cdone{text-decoration:line-through;opacity:.6}
.dot{cursor:pointer;font-style:normal;padding:0 3px;color:var(--muted)}.dot.s1{color:#e8922a}.dot.s2{color:#2ba84a}
.box:focus{outline:none}
body.focus #secs,body.focus #pgs{display:none}
.gp{cursor:grab;touch-action:none;color:var(--muted);padding:0 4px;font-style:normal;user-select:none}
.pg.dt,.sec.dt{box-shadow:inset 0 2px 0 var(--accent)}.pg.db,.sec.db{box-shadow:inset 0 -2px 0 var(--accent)}.sec.dm{outline:2px solid var(--accent)}
@page{margin:12mm}
@media print{
 :root:root:root{--bg:#fff;--text:#000;--muted:#444;--line:#999;--head:#eee;--sel:#eee;color-scheme:light}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #sbar,#secs,#pgs,#fb,#stt,#toast,#lock,.bh,.br{display:none!important}
 #app{display:block}main{padding:0}body{background:#fff}
 .box,.box:hover,.box:focus-within{border-color:transparent!important;background:none!important}
 .wrap{overflow:visible}table.w{min-width:0}.ms{outline:none}
}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lk{width:100%;max-width:360px}.lk h2{margin:0 0 4px}.lk label{display:block;margin:10px 0 2px;color:var(--muted)}
.lk input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
#lkErr{color:#d33;margin-top:10px;min-height:18px}
#stt{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--muted)}
dialog textarea{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:12px monospace}
dialog select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.bc table.t1{border-collapse:collapse}.bc table.t1 td,.bc table.t1 th{border:1px solid var(--line);padding:4px 6px;height:28px;min-width:60px}
dialog label{display:block;margin:8px 0 2px;color:var(--muted)}
dialog input{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>div{flex:1;min-width:90px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:50}
#bMenu,#bTools,#bd{display:none}
#side{display:flex;flex:none}
#sbar{display:flex;gap:6px;align-items:center}
#q{flex:1;min-width:0}
@media(max-width:760px){
 body{font-size:15px}
 #bMenu,#bTools{display:inline-flex;align-items:center;height:36px;padding:0 10px;flex:none}
 #q{height:36px;font-size:16px}
 #app{display:block}
 #side{position:fixed;top:0;bottom:0;left:0;width:min(88vw,340px);z-index:70;flex-direction:column;overflow-y:auto;background:var(--side);transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 24px rgba(0,0,0,.4)}
 body.nav #side{transform:none}
 body.nav #bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
 #secs,#pgs{width:100%;border:0;flex:none}
 #pgs{background:var(--bg)}
 .sec,.pg{padding:11px 10px}.x{font-size:17px;padding:6px}
 #stt{position:static;flex-wrap:wrap;border:0;border-top:1px solid var(--line);border-radius:0;margin-top:auto;padding:10px;background:var(--side)}
 #stt button{height:34px}
 main{padding:10px}
 #title{font-size:20px}
 #fb{display:none;flex-wrap:nowrap;overflow-x:auto;gap:8px;top:calc(env(safe-area-inset-top,0px) + 48px)}
 body.tools #fb{display:flex}
 .fg{flex:none}.fr{flex-wrap:nowrap}
 #fb select,input,textarea{font-size:16px}
 #page{overflow-x:auto;overflow-y:hidden;touch-action:manipulation}
 .br{width:26px;height:26px}.bh{height:26px}
 table.w{min-width:760px}
 table.w th:first-child,table.w td:first-child{position:sticky;left:0;z-index:1;width:110px}
 dialog{max-height:90vh;overflow:auto}
}
</style>
</head>
<body>
<div id="sbar"><button class="btn" id="bMenu" title="Carnets, sections et pages">☰</button><input id="q" type="search" placeholder="🔍 Rechercher…" title="Rechercher dans tous les carnets (Ctrl+K)" autocomplete="off"><button class="btn" id="bTools" title="Outils de mise en forme">🛠</button><div id="res"></div></div>
<div id="app"><div id="side"><nav id="secs"></nav><nav id="pgs"></nav><div id="stt"><span id="sts"></span><button class="btn sm" id="bT" title="Basculer clair / sombre">🌙</button><button class="btn sm" id="bX">💾 Exporter</button><button class="btn sm" id="bI">📥 Importer</button><button class="btn sm" id="bL" style="display:none">🔒 Verrouiller</button><button class="btn sm" id="bK" style="display:none" title="Changer le jeton GitHub">🔑 Jeton</button></div></div><main id="main"></main></div>
<div id="bd"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden><input type="file" id="fXls" accept=".xlsx,.xls,.csv" hidden>
<div id="lock"><div class="lk"><h2>📓 Mon carnet</h2><p id="lkMsg" style="margin:0;color:var(--muted)"></p>
<label>E-mail</label><input id="lkE" type="email" autocomplete="username">
<label>Mot de passe</label><input id="lkP" type="password" autocomplete="current-password">
<div id="lkSet" style="display:none"><label>Dépôt privé de données (pseudo/nom)</label><input id="lkR" autocomplete="off">
<label>Jeton GitHub (accès à ce dépôt uniquement)</label><input id="lkT" type="password" autocomplete="off"></div>
<button class="btn" id="lkGo" style="margin-top:14px;border-color:var(--accent)">Se connecter</button><div><button class="link" id="lkCh" style="display:none">🔑 Changer le jeton / le dépôt</button></div><div id="lkErr"></div></div></div>
<div id="toast"></div>

<dialog id="dx"><h3 id="dxT" style="margin:0 0 6px"></h3><p id="dxP" style="margin:0 0 6px;color:var(--muted)"></p><textarea id="dxA" rows="8"></textarea><input type="file" id="dxF" accept=".json,.txt" style="margin-top:6px"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="dxC">Copier</button><button class="btn" id="dxD">Télécharger</button><button class="btn" id="dxOk" style="border-color:var(--accent)">Importer</button><button class="btn" id="dxNo">Fermer</button></div></dialog>
<dialog id="dq"><p id="ql" style="margin:0 0 8px"></p><input id="qi"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="qno">Annuler</button><button class="btn" id="qok" style="border-color:var(--accent)">OK</button></div></dialog>
<dialog id="dlg">
 <h3 style="margin:0 0 6px">Pré-créer des pages hebdomadaires</h3>
 <p style="margin:0;color:var(--muted)">Les matières sont copiées depuis la page ouverte (ou le modèle par défaut).</p>
 <label>Nom après le numéro</label><input id="dPre" value="Rapport BTS">
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dDt" checked style="width:auto"> Afficher les dates (colonnes et sous-titre)</label>
 <div class="row"><div><label>Début : année</label><input id="dY" type="number" value="2026"></div>
 <div><label>Semaine début</label><input id="dA" type="number" value="37"></div>
 <div><label>Fin : année</label><input id="dY2" type="number" value="2027"></div>
 <div><label>Semaine fin</label><input id="dB" type="number" value="25"></div>
 <div><label>Pas</label><input id="dS" type="number" value="2" min="1"></div></div>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="dNo">Annuler</button><button class="btn" id="dOk" style="border-color:var(--accent)">Créer les pages</button></div>
</dialog>
<dialog id="dn"><h3 id="dnT" style="margin:0 0 6px">Nouveau tableau</h3>
 <div class="row nf"><div><label>Lignes</label><input id="nR" type="number" value="5" min="1" max="100"></div><div><label>Colonnes</label><input id="nC" type="number" value="5" min="1" max="30"></div></div>
 <label class="nf">Dates automatiques</label><select id="nM" class="nf"><option value="">Sans dates (tableau vide)</option><option value="c">Dates dans l’en-tête (colonnes)</option><option value="r">Dates dans la 1re colonne (lignes)</option></select>
 <div id="nDt"><div class="row"><div><label>Date de début</label><input id="nD" type="date"></div><div><label>Pas (jours)</label><input id="nP" type="number" value="1" min="1"></div></div>
 <label>Format</label><select id="nF"><option value="c">Lun 07 Sept</option><option value="l">Lundi 07 Septembre</option><option value="n">07/09/2026</option><option value="d">07 Septembre 2026</option><option value="j">Lundi (jour seul, sans date)</option></select>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nW" checked style="width:auto"> Sans week-end</label></div>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="nNo">Annuler</button><button class="btn" id="nOk" style="border-color:var(--accent)">Créer le tableau</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/tableaux.js"></script>
<script src="js/excel.js"></script>
<script src="js/outils.js"></script>
<script src="js/pdf.js"></script>
<script src="js/confort.js"></script>
<script src="js/mobile.js"></script>
<script src="js/synchro.js"></script>

</body>
</html>
